name: Screener

on:
  schedule:
    - cron: "15 22 * * 1-5"   # Mo-Fr um 22:15 UTC, nach Börsenschluss in den USA
  workflow_dispatch:           # erlaubt den Start per Knopfdruck

concurrency:                   # nie zwei Läufe gleichzeitig
  group: screener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: pip install -r requirements.txt

      - name: Aktienliste aktualisieren
        run: python liste_erstellen.py || echo "Liste nicht aktualisiert, bestehende wird genutzt"

      - name: Screener ausführen
        run: python scan_index.py

      - name: Ergebnis speichern
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/ergebnis.json docs/kurse aktien.csv
          git diff --cached --quiet || git commit -m "Tägliches Update"
          git pull --rebase || true
          git push
