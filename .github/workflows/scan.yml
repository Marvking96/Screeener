name: Screener

on:
  schedule:
    - cron: "15 22 * * 1-5"   # Mo-Fr um 22:15 UTC, nach Börsenschluss in den USA
    - cron: "45 17 * * 1-5"   # Mo-Fr um 17:45 UTC, nach Xetra-Schluss: speichert nur die europäischen Kurse
  workflow_dispatch:           # erlaubt den Start per Knopfdruck

concurrency:                   # nie zwei Läufe gleichzeitig
  group: screener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: pip install -r requirements.txt

      - name: Aktienliste aktualisieren
        run: python liste_erstellen.py || echo "Liste nicht aktualisiert, bestehende wird genutzt"

      - name: Screener ausführen
        run: python scan_index.py ${{ github.event.schedule == '45 17 * * 1-5' && 'europa' || '' }}

      - name: Ergebnis speichern
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          # nur die Dateien, die dieser Lauf geändert hat, sichern; falls inzwischen jemand anderes gespeichert hat
          # (zweiter Lauf, Datei-Upload), auf dessen Stand aufsetzen und nur unsere geänderten Dateien darüberlegen
          git add -A docs/ergebnis.json docs/kurse aktien.csv
          git diff --cached --name-only --diff-filter=AM > /tmp/geaendert.txt
          git diff --cached --name-only --diff-filter=D > /tmp/geloescht.txt
          if [ ! -s /tmp/geaendert.txt ] && [ ! -s /tmp/geloescht.txt ]; then echo "Keine Änderungen"; exit 0; fi
          if [ -s /tmp/geaendert.txt ]; then tar czf /tmp/ergebnis.tgz -T /tmp/geaendert.txt; fi
          for versuch in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ -s /tmp/geaendert.txt ]; then tar xzf /tmp/ergebnis.tgz; xargs -a /tmp/geaendert.txt git add; fi
            if [ -s /tmp/geloescht.txt ]; then xargs -a /tmp/geloescht.txt git rm -q --ignore-unmatch; fi
            if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
            git commit -q -m "Tägliches Update"
            if git push -q origin HEAD:main; then echo "Gespeichert"; exit 0; fi
            echo "Speichern fehlgeschlagen, neuer Versuch ..."; sleep 5
          done
          exit 1
