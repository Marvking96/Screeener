<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1-2-3 Screener</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1-2-3">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#14161a; --muted:#6a7280; --line:#e2e5ea;
  --long:#12935f; --short:#d6384a; --accent:#2b6df0; --chip:#e9ecf1; --chart:#4b5563;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --text:#eceef2; --muted:#8b93a1; --line:#272b33;
    --long:#2ecc8f; --short:#ff5d6e; --accent:#6c9bff; --chip:#222630; --chart:#aab2c0; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.warn{background:#ff9f1c22;border:1px solid #ff9f1c88;border-radius:10px;padding:10px 12px;
  font-size:14px;margin:0 0 12px}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;
  padding:9px 0;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px #0003}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;
  padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.head{width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:12px 14px;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--muted);font-size:13px}
.right{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px}
.badge.long{color:var(--long);background:color-mix(in srgb,var(--long) 16%,transparent)}
.badge.short{color:var(--short);background:color-mix(in srgb,var(--short) 16%,transparent)}
.detail{display:none;padding:0 14px 14px}
.card.open .detail{display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px;font-size:13px}
.facts div{background:var(--chip);border-radius:10px;padding:7px 9px}
.facts b{display:block;font-size:15px}
.facts span{color:var(--muted);font-size:12px}
svg{width:100%;height:auto;display:block}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.empty{color:var(--muted);text-align:center;padding:36px 12px}
footer{color:var(--muted);font-size:12px;padding:14px 4px 28px}
</style>
</head>
<body>
<div class="wrap">
  <h1>1-2-3 Screener</h1>
  <p class="sub" id="sub">Lade Daten …</p>
  <div id="warn"></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-signale" aria-selected="true">Signale</button>
    <button role="tab" id="tab-setups" aria-selected="false">Setups</button>
  </div>
  <div class="filters" id="filters"></div>
  <input type="search" id="suche" placeholder="Name oder Kürzel suchen" autocomplete="off">
  <div id="liste"></div>
  <footer id="fuss"></footer>
</div>
<script>
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const zahl = new Intl.NumberFormat("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const state = {daten: null, tab: "signale", richtung: "alle", index: "alle", suche: "", offen: null};

function el(tag, attrs, ...kinder) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const kind of kinder) if (kind != null) e.append(kind);
  return e;
}
function sv(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const datumDE = iso => { const [y, m, d] = iso.split("-"); return d + "." + m + "." + y; };
const kurzDatum = iso => { const [, m, d] = iso.split("-"); return d + "." + m + "."; };
const handelstage = n => n === 0 ? "am letzten Handelstag" : n === 1 ? "1 Handelstag her" : n + " Handelstage her";

function chart(e) {
  const W = 360, H = 220, pl = 8, pr = 58, pt = 18, pb = 24;
  const c = e.kurse.c, d = e.kurse.d, n = c.length;
  const long = e.richtung === "long";
  const farbe = long ? "var(--long)" : "var(--short)";
  const alle = c.concat([e.punkt2, e.punkt3]);
  let lo = Math.min(...alle), hi = Math.max(...alle);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = i => pl + (W - pl - pr) * (n <= 1 ? 0 : i / (n - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const s = sv("svg", {viewBox: "0 0 " + W + " " + H, role: "img",
    "aria-label": "Kursverlauf " + e.name + " mit den Punkten 1, 2 und 3"});
  // Hilfslinien für Punkt 2 und Punkt 3
  [[e.punkt2, farbe], [e.punkt3, "var(--muted)"]].forEach(([wert, col]) => {
    s.append(sv("line", {x1: pl, x2: W - pr, y1: y(wert), y2: y(wert), stroke: col, "stroke-width": 1,
      "stroke-dasharray": "4 3", opacity: 0.8}));
  });
  // Beschriftungen rechts, ohne dass sie sich überlappen
  const beschr = [
    {y: y(e.punkt2) + 4, text: "2: " + zahl.format(e.punkt2), col: farbe, fett: 600},
    {y: y(e.punkt3) + 4, text: "3: " + zahl.format(e.punkt3), col: "var(--muted)", fett: 600},
    {y: y(c[n - 1]) + 4, text: zahl.format(c[n - 1]), col: "var(--accent)", fett: 400},
  ].sort((a, b) => a.y - b.y);
  for (let k = 1; k < beschr.length; k++) if (beschr[k].y - beschr[k - 1].y < 13) beschr[k].y = beschr[k - 1].y + 13;
  const maxY = H - pb - 2;
  if (beschr[beschr.length - 1].y > maxY) {
    beschr[beschr.length - 1].y = maxY;
    for (let k = beschr.length - 2; k >= 0; k--) if (beschr[k + 1].y - beschr[k].y < 13) beschr[k].y = beschr[k + 1].y - 13;
  }
  beschr.forEach(b => s.append(sv("text", {x: W - pr + 4, y: b.y, fill: b.col, "font-size": 11, "font-weight": b.fett}, b.text)));
  // Kurslinie
  const pts = c.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  s.append(sv("polyline", {points: pts, fill: "none", stroke: "var(--chart)", "stroke-width": 1.6,
    "stroke-linejoin": "round", "stroke-linecap": "round"}));
  // aktueller Kurs
  s.append(sv("circle", {cx: x(n - 1), cy: y(c[n - 1]), r: 3, fill: "var(--accent)"}));
  // Punkte 1-2-3
  for (const p of e.kette) {
    const i = d.indexOf(p.d); if (i < 0) continue;
    const hoch = long ? p.nr === 2 : p.nr !== 2;
    const cx = x(i), cy = y(p.c), oy = hoch ? -13 : 13;
    s.append(sv("circle", {cx: cx, cy: cy, r: 2.5, fill: farbe}));
    s.append(sv("circle", {cx: cx, cy: cy + oy, r: 8, fill: farbe}));
    s.append(sv("text", {x: cx, y: cy + oy + 4, "text-anchor": "middle", fill: "#fff", "font-size": 11, "font-weight": 700}, String(p.nr)));
  }
  // Ausbruchstag
  if (e.signaltag) {
    const i = d.indexOf(e.signaltag);
    if (i >= 0) s.append(sv("text", {x: x(i), y: y(c[i]) + (long ? -6 : 14), "text-anchor": "middle",
      fill: "var(--accent)", "font-size": 16}, "★"));
  }
  // Datumsachse
  [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => {
    s.append(sv("text", {x: x(i), y: H - 6, "text-anchor": k === 0 ? "start" : k === 2 ? "end" : "middle",
      fill: "var(--muted)", "font-size": 10}, kurzDatum(d[i])));
  });
  return s;
}

function karte(e, art) {
  const long = e.richtung === "long";
  const offen = state.offen === art + e.kuerzel + e.richtung;
  const rechts = art === "signale"
    ? el("div", {class: "right"}, handelstage(e.tage_her))
    : el("div", {class: "right"}, "noch " + zahl.format(e.abstand) + " %");
  const unten = art === "signale"
    ? "Ausbruch " + (long ? "über " : "unter ") + zahl.format(e.punkt2) + " · Kurs " + zahl.format(e.kurs)
    : "Ausbruch bei " + zahl.format(e.punkt2) + " · Kurs " + zahl.format(e.kurs);
  const kopf = el("button", {class: "head", "aria-expanded": String(offen)},
    el("div", {class: "name", text: e.name}),
    rechts,
    el("div", {class: "meta"}, el("span", {class: "badge " + e.richtung, text: long ? "Long" : "Short"}),
      document.createTextNode(e.kuerzel + " · " + e.index)),
    el("div", {class: "right", text: ""}));
  const unterzeile = el("div", {class: "meta", text: unten, style: "grid-column:1 / -1"});
  kopf.append(unterzeile);
  const k = el("div", {class: "card" + (offen ? " open" : "")}, kopf);
  const detail = el("div", {class: "detail"});
  k.append(detail);
  const fuellen = () => {
    detail.replaceChildren();
    const fakten = el("div", {class: "facts"},
      el("div", {}, el("b", {text: zahl.format(e.punkt2)}), el("span", {text: "Punkt 2"})),
      el("div", {}, el("b", {text: zahl.format(e.punkt3)}), el("span", {text: "Punkt 3"})),
      el("div", {}, el("b", {text: art === "signale" ? datumDE(e.signaltag) : zahl.format(e.abstand) + " %"}),
        el("span", {text: art === "signale" ? "Ausbruchstag" : "bis zum Ausbruch"})));
    detail.append(fakten, chart(e),
      el("p", {class: "hint", text: "Schlusskurse, letzte " + e.kurse.c.length + " Handelstage. Zahlen = 1-2-3-Punkte" +
        (art === "signale" ? ", Stern = Ausbruch." : ".")}));
  };
  if (offen) fuellen();
  kopf.addEventListener("click", () => {
    const schluessel = art + e.kuerzel + e.richtung;
    const warOffen = k.classList.contains("open");
    document.querySelectorAll(".card.open").forEach(x => { x.classList.remove("open"); x.firstChild.setAttribute("aria-expanded", "false"); });
    if (!warOffen) { fuellen(); k.classList.add("open"); kopf.setAttribute("aria-expanded", "true"); state.offen = schluessel; }
    else state.offen = null;
  });
  return k;
}

function zeichne() {
  const d = state.daten; if (!d) return;
  const art = state.tab;
  document.getElementById("tab-signale").textContent = "Signale (" + d.signale.length + ")";
  document.getElementById("tab-setups").textContent = "Setups (" + d.setups.length + ")";
  document.getElementById("tab-signale").setAttribute("aria-selected", String(art === "signale"));
  document.getElementById("tab-setups").setAttribute("aria-selected", String(art === "setups"));
  const q = state.suche.trim().toLowerCase();
  const liste = d[art].filter(e =>
    (state.richtung === "alle" || e.richtung === state.richtung) &&
    (state.index === "alle" || e.index === state.index) &&
    (!q || e.name.toLowerCase().includes(q) || e.kuerzel.toLowerCase().includes(q)));
  const ziel = document.getElementById("liste");
  ziel.replaceChildren();
  if (!liste.length) {
    ziel.append(el("div", {class: "empty", text: d[art].length ? "Nichts gefunden. Filter anpassen." :
      art === "signale" ? "Keine frischen Signale." : "Keine aktiven Setups."}));
    return;
  }
  liste.forEach(e => ziel.append(karte(e, art)));
}

function filterLeiste() {
  const f = document.getElementById("filters"); f.replaceChildren();
  const indizes = ["alle", ...new Set([...state.daten.signale, ...state.daten.setups].map(e => e.index))];
  const mk = (text, gruppe, wert) => {
    const b = el("button", {class: "chip", text: text, "aria-pressed": String(state[gruppe] === wert)});
    b.addEventListener("click", () => { state[gruppe] = wert; filterLeiste(); zeichne(); });
    return b;
  };
  [["Alle", "alle"], ["Long", "long"], ["Short", "short"]].forEach(([t, w]) => f.append(mk(t, "richtung", w)));
  indizes.filter(i => i !== "alle").forEach(i => f.append(mk(i, "index", state.index === i ? "alle" : i)));
}

async function start() {
  document.getElementById("tab-signale").addEventListener("click", () => { state.tab = "signale"; zeichne(); });
  document.getElementById("tab-setups").addEventListener("click", () => { state.tab = "setups"; zeichne(); });
  document.getElementById("suche").addEventListener("input", ev => { state.suche = ev.target.value; zeichne(); });
  let d;
  try {
    const r = await fetch("ergebnis.json", {cache: "no-cache"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (fehler) {
    document.getElementById("sub").textContent = "Daten konnten nicht geladen werden.";
    document.getElementById("liste").append(el("div", {class: "empty",
      text: "Noch keine Ergebnisdatei vorhanden oder keine Verbindung. (" + fehler.message + ")"}));
    return;
  }
  state.daten = d;
  const erstellt = new Date(d.erstellt);
  document.getElementById("sub").textContent = "Stand: " + (d.letzter_handelstag ? datumDE(d.letzter_handelstag) : "?") +
    " · " + d.anzahl_geprueft + " von " + d.anzahl_gesamt + " Aktien geprüft";
  const alterTage = (Date.now() - erstellt.getTime()) / 86400000;
  if (alterTage > 4) {
    document.getElementById("warn").append(el("div", {class: "warn",
      text: "Die Daten sind " + Math.floor(alterTage) + " Tage alt. Der automatische Lauf scheint nicht mehr zu funktionieren."}));
  }
  document.getElementById("fuss").textContent = "Berechnet " + erstellt.toLocaleString("de-DE", {dateStyle: "short", timeStyle: "short"}) +
    " aus Schlusskursen von Yahoo Finance (Fenster N=" + d.einstellungen.N + "). Keine Anlageberatung.";
  filterLeiste();
  zeichne();
}
start();
</script>
</body>
</html>
