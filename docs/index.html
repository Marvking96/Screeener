<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1-2-3 Screener</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1-2-3">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#14161a; --muted:#6a7280; --line:#e2e5ea;
  --long:#12935f; --short:#d6384a; --accent:#2b6df0; --chip:#e9ecf1; --chart:#4b5563; --warn:#b26a00; --gold:#e0a000;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --text:#eceef2; --muted:#8b93a1; --line:#272b33;
    --long:#2ecc8f; --short:#ff5d6e; --accent:#6c9bff; --chip:#222630; --chart:#aab2c0; --warn:#ffb454; --gold:#ffc233; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.warn{background:#ff9f1c22;border:1px solid #ff9f1c88;border-radius:10px;padding:10px 12px;
  font-size:14px;margin:0 0 12px}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;
  padding:7px 1px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.tabs button small{font-size:12px;font-weight:600;opacity:.75}
.tabs button{flex:1 1 auto}
@media (max-width:400px){.tabs button{font-size:13px}.tabs button small{font-size:11px}}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px #0003}
.filters{margin-bottom:10px}
.filters .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;
  padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.top{display:flex;align-items:flex-start}
.head,.plain{flex:1;min-width:0;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:12px 4px 12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.head{cursor:pointer}
.star{border:0;background:none;font-size:24px;line-height:1;padding:11px 14px 11px 8px;cursor:pointer;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold)}
.pos{color:var(--long)} .neg{color:var(--short)}
.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--muted);font-size:13px}
.right{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px}
.badge.long{color:var(--long);background:color-mix(in srgb,var(--long) 16%,transparent)}
.badge.alt{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent);margin:0 0 0 6px}
.badge.short{color:var(--short);background:color-mix(in srgb,var(--short) 16%,transparent)}
.detail{display:none;padding:0 14px 14px}
.card.open .detail{display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px;font-size:13px}
.facts div{background:var(--chip);border-radius:10px;padding:7px 9px}
.facts b{display:block;font-size:15px}
.facts span{color:var(--muted);font-size:12px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px;align-items:center}
.ctrl .chip{font-size:12px;padding:4px 10px}
.ctrl .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
svg{width:100%;height:auto;display:block}
.rbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rbox h2{font-size:15px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.feld input{font:inherit;font-size:16px;color:var(--text);padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);width:100%;min-width:0}
.zeile{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.zeile:last-child{border-bottom:0}
.zeile span{color:var(--muted)} .zeile b{white-space:nowrap;text-align:right}
.zeile.stark{font-size:15px} .zeile.stark span{color:var(--text)}
.zielbox{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px;padding:10px 12px;margin:8px 0}
.zielbox .gross{font-size:26px;font-weight:700;letter-spacing:-.01em}
.knopf{border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:13px;padding:7px 12px;
  border-radius:10px;cursor:pointer;margin-top:8px}
.fehl{color:var(--short);font-size:14px}
.cbox{position:relative}
.filters .row .meta{align-self:center;margin-right:2px}
.volzeile{font-size:13px;color:var(--muted);margin:0 0 8px}
.popup{position:absolute;top:6px;z-index:2;width:max-content;max-width:calc(100% - 12px);font-size:12px;
  background:color-mix(in srgb,var(--card) 93%,transparent);border:1px solid var(--line);border-radius:10px;
  padding:7px 9px;box-shadow:0 4px 14px #0004;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.popup.links{left:6px} .popup.rechts{right:6px}
.popup .pk{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.popup .pk b{flex:1;font-size:12px}
.popup .pk button{border:0;background:var(--chip);color:var(--text);border-radius:7px;width:27px;height:25px;
  font-size:15px;line-height:1;cursor:pointer;padding:0}
.popup .pgrid{display:grid;grid-template-columns:auto auto;gap:2px 16px}
.popup .pz{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.popup .pz span{color:var(--muted)}
.vollbild{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.vb-kopf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.vb-kopf .titel{flex:1 1 100%;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb-kopf .chip{font-size:14px;padding:6px 12px}
.vb-kopf .rechts-aus{margin-left:auto}
.vb-flaeche{flex:1;position:relative;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.vb-flaeche svg{position:absolute;inset:0;width:100%;height:100%}
.vb-flaeche svg.fk{pointer-events:none;z-index:1}
.vb-flaeche{-webkit-touch-callout:none}
.vb-fuss{color:var(--muted);font-size:12px;padding:6px 12px 8px;border-top:1px solid var(--line)}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.posbox{background:var(--chip);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.posbox.leer{background:none;padding:0}
.posbox .knopf{background:var(--card);margin-right:6px}
.posbox.leer .knopf{background:var(--chip)}
.posbox .zeile{font-size:13px;padding:5px 0}
.posbox .feld input{background:var(--card)}
.poskopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:4px}
.poskopf span{color:var(--muted);font-size:12px}
.pstatus{font-weight:650;font-size:13px;margin:2px 0 4px}
.posknoepfe{display:flex;flex-wrap:wrap}
.knopf.gefahr{background:var(--short);border-color:var(--short);color:#fff}
.pbarwrap{margin:30px 6px 4px}
.pbar{position:relative;height:8px;border-radius:99px}
.pbar i{position:absolute;top:50%;transform:translate(-50%,-50%)}
.pbar .pk{width:2px;height:18px;background:var(--text)}
.pbar .pp{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.pbar .pl{position:absolute;bottom:13px;transform:translateX(-50%);font-size:11px;font-weight:650;white-space:nowrap}
.pachse{position:relative;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;height:14px}
.pwrap{padding:0 14px 12px}
.empty{color:var(--muted);text-align:center;padding:36px 12px}
footer{color:var(--muted);font-size:12px;padding:14px 4px 28px}
</style>
</head>
<body>
<div class="wrap">
  <h1>1-2-3 Screener</h1>
  <p class="sub" id="sub">Lade Daten …</p>
  <div id="anzeige"></div>
  <div id="warn"></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-signale" aria-selected="true">Signale</button>
    <button role="tab" id="tab-setups" aria-selected="false">Setups</button>
    <button role="tab" id="tab-ruecksetzer" aria-selected="false">Rücksetzer</button>
    <button role="tab" id="tab-merkliste" aria-selected="false">Watchlist</button>
    <button role="tab" id="tab-rechner" aria-selected="false">Rechner</button>
  </div>
  <div class="filters" id="filters"></div>
  <input type="search" id="suche" placeholder="Name oder Kürzel suchen" autocomplete="off">
  <div id="liste"></div>
  <footer id="fuss"></footer>
</div>
<script>
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const zahl = new Intl.NumberFormat("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const speicher = {
  lies(k, std) { try { const v = localStorage.getItem(k); return v == null ? std : JSON.parse(v); } catch (_) { return std; } },
  schreib(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};
const state = {
  daten: null, tab: "signale", richtung: "alle", index: "alle", volumen: "alle", suche: "", offen: null,
  ansicht: speicher.lies("ansicht", "kerzen"),       // "kerzen" oder "linie"
  zeitraum: speicher.lies("zeitraum", "auto"),       // "auto", "3m" oder "alles"
  merkliste: speicher.lies("merkliste", []),         // Liste von Kürzeln
  waehrung: speicher.lies("waehrung", "orig"),       // "orig" (Heimatwährung) oder "eur"
  positionen: speicher.lies("positionen", {}),      // simulierte Positionen je Kürzel
  alle: new Map(),
  kurse: new Map(), kurseLaden: new Map(),            // nachgeladene Kursverläufe (Aktien ohne Signal)
  chartOffen: {}                                      // Chart in der einfachen Karte auf-/zugeklappt
};
if (!Array.isArray(state.merkliste)) state.merkliste = [];
if (!state.positionen || typeof state.positionen !== "object" || Array.isArray(state.positionen)) state.positionen = {};

function el(tag, attrs, ...kinder) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const kind of kinder) if (kind != null) e.append(kind);
  return e;
}
function sv(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const datumDE = iso => { const [y, m, d] = iso.split("-"); return d + "." + m + "." + y; };
const kurzDatum = iso => { const [, m, d] = iso.split("-"); return d + "." + m + "."; };
const handelstage = n => n === 0 ? "am letzten Handelstag" : n === 1 ? "1 Handelstag her" : n + " Handelstage her";
const prozent = v => (v > 0 ? "+" : "") + zahl.format(v) + " %";

/* ---------- Währung ---------- */
const waehrungVon = e => e.waehrung || (e.index === "S&P 500" ? "USD" : "EUR");
const euroModus = () => state.waehrung === "eur" && !!(state.daten && state.daten.eur_usd);
const faktor = e => (euroModus() && waehrungVon(e) === "USD") ? 1 / state.daten.eur_usd : 1;
const zeichenVon = e => (waehrungVon(e) === "USD" && !euroModus()) ? "$" : "€";
const geld = (e, v) => zahl.format(v * faktor(e)) + " " + zeichenVon(e);

/* ---------- Watchlist ---------- */
const istMerk = k => state.merkliste.includes(k);
function merkeUm(k) {
  const i = state.merkliste.indexOf(k);
  if (i >= 0) state.merkliste.splice(i, 1); else state.merkliste.push(k);
  speicher.schreib("merkliste", state.merkliste);
  return istMerk(k);
}
function stern(k) {
  const b = el("button", {class: "star", type: "button"});
  const setze = () => {
    const an = istMerk(k);
    b.textContent = an ? "★" : "☆";
    b.setAttribute("aria-pressed", String(an));
    b.setAttribute("aria-label", an ? "Aus der Watchlist entfernen" : "Zur Watchlist hinzufügen");
  };
  setze();
  b.addEventListener("click", () => {
    merkeUm(k); setze();
    if (state.tab === "merkliste") zeichne(); else tabBeschriftung();
  });
  return b;
}

/* ---------- Simulierte Positionen (nur auf diesem Gerät) ---------- */
const istObjekt = o => !!o && typeof o === "object" && !Array.isArray(o);
const position = k => { const p = state.positionen[k]; return istObjekt(p) && p.kauf > 0 ? p : null; };
function positionSpeichern(k, p) {
  if (p) state.positionen[k] = p; else delete state.positionen[k];
  if (p && state.chartOffen) delete state.chartOffen[k];      // nach dem Speichern den Chart wieder zeigen
  speicher.schreib("positionen", state.positionen);
}
const anzeigeWaehrung = e => (waehrungVon(e) === "USD" && !euroModus()) ? "USD" : "EUR";
function umrechnen(v, von, nach) {                 // EUR <-> USD mit dem heutigen Kurs
  if (v == null || von === nach) return v;
  const r = state.daten && state.daten.eur_usd; if (!r) return v;
  return von === "EUR" ? v * r : v / r;
}
// Eintrag mit Kursverlauf (Signal oder Setup) zu einem Kürzel, sonst der einfache Eintrag
const alleMuster = () => [...state.daten.signale, ...state.daten.setups, ...(state.daten.ruecksetzer || [])];
const mitKursen = (k, ersatz) => alleMuster().find(x => x.kuerzel === k && x.kurse) ||
  (state.kurse.get(k) ? {...ersatz, kurse: state.kurse.get(k)} : ersatz);
// Kursverlauf einer Aktie aus docs/kurse/<Kürzel>.json nachladen (einmal je Sitzung)
function ladeKurse(k) {
  if (!state.kurseLaden.has(k)) state.kurseLaden.set(k,
    fetch("kurse/" + encodeURIComponent(k.replace("/", "_")) + ".json", {cache: "no-cache"})
      .then(r => r.ok ? r.json() : null).catch(() => null)
      .then(K => state.kurse.set(k, K && Array.isArray(K.d) && Array.isArray(K.c) && K.d.length > 1 ? K : null)));
  return state.kurseLaden.get(k);
}

// alle Werte in der Anzeigewährung; Ergebnis, Abstände und ob Stop/Ziel seit dem Kauf berührt wurden
function positionAuswerten(e, p) {
  const nach = anzeigeWaehrung(e), u = v => v == null ? null : umrechnen(v, p.waehrung || waehrungVon(e), nach);
  const K = u(p.kauf), S = u(p.stop), Z = u(p.ziel), P = e.kurs != null ? e.kurs * faktor(e) : null;
  const long = Z != null ? Z > K : S != null ? S < K : true, vz = long ? 1 : -1, n = p.stueck || null;
  // Kosten: Spread/Slippage je Aktie (Währung der Eingabe), Gebühren je Order in Euro
  const sk = u(p.slipKauf) || 0, sv = u(p.slipVerkauf) || 0, je = sk + sv;
  const inAnzeige = v => v ? umrechnen(v, "EUR", nach) : 0, gk = inAnzeige(p.gebKauf), gv = inAnzeige(p.gebVerkauf);
  const r = {K, S, Z, P, long, n, datum: p.datum || null, sk, sv, gk, gv,
    mitKosten: n ? !!(sk || sv || gk || gv) : !!(sk || sv), nurGebuehrOhneStueck: !n && !!(gk || gv), kostenErfasst: p.gebKauf != null || p.gebVerkauf != null || p.slipKauf != null || p.slipVerkauf != null};
  // Ergebnis nach Kosten, wenn zum Kurs X verkauft (Long) bzw. zurückgekauft (Short) wird
  const netto = X => vz * n * (X - K) - n * je - gk - gv;
  if (n) { r.einsatz = n * K + n * sk + gk; r.kosten = n * je + gk + gv; }
  r.be = K + vz * (je + (n ? (gk + gv) / n : 0));     // Break-even: ab hier Gewinn nach Kosten
  if (P != null) {
    if (n) { r.erg = netto(P); r.ergProz = r.erg / r.einsatz * 100; }
    else r.ergProz = (vz * (P - K) - je) / (K + sk) * 100;
    if (S != null) r.bisStop = (S - P) / P * 100;
    if (Z != null) r.bisZiel = (Z - P) / P * 100;
  }
  if (n && S != null) r.risiko = netto(S);
  if (n && Z != null) r.chance = netto(Z);
  if (S != null && Z != null) {
    const verlust = n ? -r.risiko : vz * (K - S) + je, gewinn = n ? r.chance : vz * (Z - K) - je;
    r.crv = verlust > 0 ? gewinn / verlust : null;
  }
  const Kd = e.kurse, f = faktor(e);
  const beruehrt = (grenze, istStop) => {
    if (grenze == null) return null;
    const vonOben = long === istStop;                // Long-Stop und Short-Ziel liegen unter dem Kurs
    if (Kd && Kd.d) {
      const hoch = Kd.h || Kd.c, tief = Kd.l || Kd.c;
      for (let i = 0; i < Kd.d.length; i++) {
        if (r.datum && Kd.d[i] <= r.datum) continue; // erst ab dem Tag nach dem Kauf
        if (vonOben ? tief[i] * f <= grenze : hoch[i] * f >= grenze) return Kd.d[i];
      }
      return null;
    }
    if (P == null) return null;
    return (vonOben ? P <= grenze : P >= grenze) ? (e.stand || r.datum || "") : null;
  };
  r.stopTag = beruehrt(S, true); r.zielTag = beruehrt(Z, false);
  return r;
}
const positionFuerChart = e => { const p = position(e.kuerzel); if (!p) return null;
  const a = positionAuswerten(e, p); return {K: a.K, S: a.S, Z: a.Z, BE: a.mitKosten ? a.be : null, datum: a.datum}; };

function positionsBadge(e) {
  const p = position(e.kuerzel); if (!p) return null;
  const a = positionAuswerten(mitKursen(e.kuerzel, e), p);
  let text, gut;
  const ersterTreffer = a.stopTag && (!a.zielTag || a.stopTag <= a.zielTag) ? "stop" : a.zielTag ? "ziel" : null;
  if (ersterTreffer === "stop") { text = "Stop berührt"; gut = false; }
  else if (ersterTreffer === "ziel") { text = "Ziel erreicht"; gut = true; }
  else if (a.ergProz != null) { text = "Pos. " + prozent(a.ergProz); gut = a.ergProz >= 0; }
  else { text = "Position"; gut = true; }
  return el("span", {class: "badge " + (gut ? "long" : "short"), style: "margin:0 0 0 6px", text: text});
}

const eingabeZahl = v => v == null ? "" : v.toLocaleString("de-DE", {useGrouping: false, maximumFractionDigits: v < 5 ? 3 : 2});

function positionsBlock(e) {
  const k = e.kuerzel, box = el("div", {class: "posbox"});
  let modus = "anzeige", loeschFrage = false;
  const render = () => {
    box.replaceChildren();
    const p = position(k);
    if (modus === "form") { box.append(...formular(p)); return; }
    if (!p) {
      const b = el("button", {class: "knopf", type: "button", text: "＋ Simulierte Position eintragen", style: "margin-top:0"});
      b.addEventListener("click", () => { modus = "form"; render(); });
      box.classList.add("leer"); box.append(b); return;
    }
    box.classList.remove("leer");
    const a = positionAuswerten(e, p), z = zeichenVon(e), g = v => zahl.format(v) + " " + z;
    box.append(el("div", {class: "poskopf"}, el("b", {text: "Simulierte Position · " + (a.long ? "Long" : "Short")}),
      el("span", {text: a.datum ? "seit " + datumDE(a.datum) : ""})));
    // Status
    if (a.stopTag || a.zielTag) {
      const stopZuerst = a.stopTag && (!a.zielTag || a.stopTag < a.zielTag), gleich = a.stopTag && a.stopTag === a.zielTag;

        ? "Ergebnisse nach Gebühren und Spread" + (a.n ? "" : " (Gebühren erst mit Stückzahl)") + ", vor Steuern. "
        : a.nurGebuehrOhneStueck ? "Gebühren werden erst mit Stückzahl eingerechnet. "

  function formular(p) {

    const kostStd = (id, std) => p ? (p[id] != null ? p[id] : (p.gebKauf == null && p.slipKauf == null ? std : null)) : (ausRechner(id) != null ? ausRechner(id) : std);
    const slipStd = id => p ? kostStd(id, null) : null;   // Spread ist je Aktie verschieden, daher nicht aus dem Rechner

    [["kauf", "Kaufkurs"], ["stop", "Stop"], ["ziel", "Kursziel"], ["slipKauf", "Spread Kauf je Aktie"], ["slipVerkauf", "Spread Verkauf je Aktie"]].forEach(([id, t]) => {

}

// Balken: Stop links, Ziel rechts, Strich = Kauf, Punkt = aktueller Kurs
function balken(a, g) {
  const t = v => Math.max(0, Math.min(1, (v - a.S) / (a.Z - a.S)));
  const tk = t(a.K) * 100, tp = t(a.P) * 100;
  const spur = el("div", {class: "pbar", role: "img",
    "aria-label": "Kurs " + g(a.P) + " zwischen Stop " + g(a.S) + " und Ziel " + g(a.Z)});
  spur.style.background = "linear-gradient(to right, color-mix(in srgb,var(--short) 45%,transparent) 0 " + tk + "%, color-mix(in srgb,var(--long) 45%,transparent) " + tk + "% 100%)";
  spur.append(el("i", {class: "pk", style: "left:" + tk + "%"}), el("i", {class: "pp", style: "left:" + tp + "%"}),
    el("span", {class: "pl", style: "left:" + Math.max(10, Math.min(90, tp)) + "%", text: "Kurs " + zahl.format(a.P)}));
  const achse = el("div", {class: "pachse"}, el("span", {text: "Stop"}),
    el("span", {style: "left:" + Math.max(14, Math.min(86, tk)) + "%;position:absolute;transform:translateX(-50%)", text: "Kauf"}),
    el("span", {text: "Ziel"}));
  return el("div", {class: "pbarwrap"}, spur, achse);
}

/* ---------- Chart (Kerzen oder Linie, Volumen, Auswahl, Vollbild) ---------- */
function fensterGroesse(e, gesamt) {
  if (state.zeitraum === "alles") return gesamt;
  if (state.zeitraum === "3m") return Math.min(63, gesamt);
  // auto: die ganze 1-2-3-Kette sichtbar, mindestens 3 Monate
  let aelteste = gesamt;
  e.kette.forEach(p => { const i = e.kurse.d.indexOf(p.d); if (i >= 0 && i < aelteste) aelteste = i; });
  return Math.min(gesamt, Math.max(63, gesamt - aelteste + 8));
}

const WOCHENTAG = new Intl.DateTimeFormat("de-DE", {weekday: "short", day: "2-digit", month: "2-digit", year: "numeric"});
const datumLang = iso => WOCHENTAG.format(new Date(iso + "T12:00:00"));
// Volumen kommt in Tausend Stück
const volText = tsd => tsd >= 1000 ? zahl.format(tsd / 1000) + " Mio." : zahl.format(tsd).replace(/,00$/, "") + " Tsd.";

// alle Reihen eines Eintrags, in die gewählte Währung umgerechnet
function reihen(e) {
  const K = e.kurse, f = faktor(e), sk = a => (a && f !== 1) ? a.map(v => v * f) : a;
  return {d: K.d, c: sk(K.c), o: sk(K.o), h: sk(K.h), l: sk(K.l), f: f,
    v: (K.v && K.v.some(x => x > 0)) ? K.v : null, p2: e.punkt2 * f, p3: e.punkt3 * f,
    hatKerzen: !!(K.o && K.h && K.l)};
}

let clipZaehler = 0;
// freie Fläche rechts neben der letzten Kerze (in Kerzenbreiten)
const leerStd = m => Math.max(2, Math.round(m * 0.05));
// zeichnet den Chart für einen Ausschnitt; opt: W, H, start, anzahl, leer, kerzen, volumen, volAnteil, wahl, pr, preis {lo,hi}, achse, position {K,S,Z,datum}
function chartBauen(e, R, opt) {
  const W = opt.W, H = opt.H, pl = 8, pr = opt.pr || 58, pt = 14, pb = 24;
  const gesamt = R.c.length;
  const m = Math.max(Math.min(8, gesamt), Math.min(gesamt, Math.round(opt.anzahl)));
  const s0 = Math.max(0, Math.min(gesamt - m, Math.round(opt.start)));
  const kerzen = !!opt.kerzen && R.hatKerzen;
  const mitVol = !!opt.volumen && !!R.v;
  const volH = mitVol ? Math.round(H * (opt.volAnteil || 0.15)) : 0;
  const unten = H - pb, preisUnten = unten - volH - (mitVol ? 8 : 0);
  const sl = a => a.slice(s0, s0 + m);
  const d = sl(R.d), c = sl(R.c);
  const o = kerzen ? sl(R.o) : c, h = kerzen ? sl(R.h) : c, l = kerzen ? sl(R.l) : c;
  const n = c.length;
  const long = e.richtung === "long";
  const farbe = long ? "var(--long)" : "var(--short)";
  const p2 = R.p2, p3 = R.p3;
  const pos = opt.position || null;
  const alle = h.concat(l, [p2, p3].filter(Number.isFinite), pos ? [pos.K, pos.S, pos.Z, pos.BE].filter(v => v != null) : []);
  let lo = Math.min(...alle), hi = Math.max(...alle);
  const pad = (hi - lo) * 0.14 || 1; lo -= pad; hi += pad;
  const auto = {lo, hi};
  if (opt.preis) { lo = opt.preis.lo; hi = opt.preis.hi; }
  const dez = (hi - lo) < 0.6 ? 3 : 2, fmt = v => v.toLocaleString("de-DE", {minimumFractionDigits: dez, maximumFractionDigits: dez});
  const leer = Math.max(0, opt.leer || 0);
  const pitch = (W - pl - pr) / (n + leer);
  const x = i => pl + pitch * (i + 0.5);
  const y = v => pt + (preisUnten - pt) * (1 - (v - lo) / (hi - lo));
  const bw = Math.max(1.2, Math.min(10, pitch * 0.68));
  const s = sv("svg", {viewBox: "0 0 " + W + " " + H, role: "img",
    "aria-label": (kerzen ? "Kerzenchart " : "Kursverlauf ") + e.name + " mit den Punkten 1, 2 und 3"});
  // ausgewählter Tag: heller Streifen hinter allem
  const wi = opt.wahl != null ? opt.wahl - s0 : -1;
  if (wi >= 0 && wi < n)
    s.append(sv("rect", {x: x(wi) - Math.max(pitch / 2, 3), y: pt, width: Math.max(pitch, 6), height: unten - pt,
      fill: "var(--accent)", opacity: 0.16}));
  // optionale Preisachse mit feinem Raster (Vollbild)
  const ticks = [];
  if (opt.achse) {
    const roh = (hi - lo) / Math.max(3, Math.floor((preisUnten - pt) / 48)), mag = Math.pow(10, Math.floor(Math.log10(roh))), fr = roh / mag;
    const step = (fr < 1.5 ? 1 : fr < 3.5 ? 2 : fr < 7.5 ? 5 : 10) * mag, k0 = Math.ceil(lo / step);
    for (let k = k0; k * step <= hi; k++) ticks.push(k * step);
    ticks.forEach(v => s.append(sv("line", {x1: pl, x2: W - pr, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 0.6, opacity: 0.7})));
  }
  // alles, was zum Preisbereich gehört, wird an dessen Rand abgeschnitten (wichtig beim vertikalen Zoom)
  const cid = "kp" + (++clipZaehler), P = sv("g", {"clip-path": "url(#" + cid + ")"});
  s.append(sv("defs", {}), P);
  s.firstChild.append(sv("clipPath", {id: cid}));
  s.firstChild.firstChild.append(sv("path", {d: "M" + pl + " " + pt + "H" + (W - pr) + "V" + Math.max(pt + 1, preisUnten) + "H" + pl + "Z"}));
  // Hilfslinien für Punkt 2 und Punkt 3
  [[p2, farbe], [p3, "var(--muted)"]].filter(([wert]) => Number.isFinite(wert)).forEach(([wert, col]) => {
    P.append(sv("line", {x1: pl, x2: W - pr, y1: y(wert), y2: y(wert), stroke: col, "stroke-width": 1,
      "stroke-dasharray": "4 3", opacity: 0.8}));
  });
  // simulierte Position: Zonen (rot bis Stop, grün bis Ziel) und Linien ab dem Kaufdatum
  if (pos) {
    let i0 = pos.datum ? d.findIndex(t => t >= pos.datum) : 0;
    const xs = i0 === -1 ? x(n - 1) : i0 <= 0 && (!pos.datum || pos.datum <= d[0]) ? pl : x(i0), xe = W - pr;
    const zone = (a, b, col) => P.append(sv("rect", {x: xs, y: Math.min(y(a), y(b)), width: Math.max(1, xe - xs),
      height: Math.abs(y(a) - y(b)), fill: col, "fill-opacity": 0.12, class: "poszone"}));
    if (pos.Z != null) zone(pos.K, pos.Z, "var(--long)");
    if (pos.S != null) zone(pos.K, pos.S, "var(--short)");
    [[pos.Z, "var(--long)"], [pos.S, "var(--short)"], [pos.K, "var(--accent)"]].forEach(([v, col]) => {
      if (v != null) P.append(sv("line", {x1: xs, x2: xe, y1: y(v), y2: y(v), stroke: col, "stroke-width": 1.4, class: "poslinie"}));
    });
    if (pos.BE != null) P.append(sv("line", {x1: xs, x2: xe, y1: y(pos.BE), y2: y(pos.BE), stroke: "var(--accent)", "stroke-width": 1,
      "stroke-dasharray": "2 3", class: "poslinie be"}));
    if (i0 >= 0 && pos.datum && pos.datum >= d[0]) P.append(sv("circle", {cx: xs, cy: y(pos.K), r: 3.5, fill: "var(--accent)", stroke: "var(--card)", "stroke-width": 1}));
  }
  // Beschriftungen rechts, ohne dass sie sich überlappen
  const beschr = [
    ...(Number.isFinite(p2) ? [{y: y(p2) + 4, text: "2: " + zahl.format(p2), col: farbe, fett: 600}] : []),
    ...(Number.isFinite(p3) ? [{y: y(p3) + 4, text: "3: " + zahl.format(p3), col: "var(--muted)", fett: 600}] : []),
    {y: y(c[n - 1]) + 4, text: zahl.format(c[n - 1]), col: "var(--accent)", fett: 400},
    ...(pos ? [[pos.K, "K", "var(--accent)"], [pos.S, "S", "var(--short)"], [pos.Z, "Z", "var(--long)"], [pos.BE, "BE", "var(--accent)"]]
      .filter(([v]) => v != null).map(([v, t, col]) => ({y: y(v) + 4, text: t + " " + zahl.format(v), col, fett: 700})) : []),
  ].filter(b => b.y - 4 >= pt - 2 && b.y - 4 <= preisUnten + 2).sort((a, b) => a.y - b.y);
  for (let k = 1; k < beschr.length; k++) if (beschr[k].y - beschr[k - 1].y < 13) beschr[k].y = beschr[k - 1].y + 13;
  const maxY = preisUnten - 2;
  if (beschr.length && beschr[beschr.length - 1].y > maxY) {
    beschr[beschr.length - 1].y = maxY;
    for (let k = beschr.length - 2; k >= 0; k--) if (beschr[k + 1].y - beschr[k].y < 13) beschr[k].y = beschr[k + 1].y - 13;
  }
  beschr.forEach(b => s.append(sv("text", {x: W - pr + 4, y: b.y, fill: b.col, "font-size": 11, "font-weight": b.fett}, b.text)));
  ticks.forEach(v => { if (!beschr.some(b => Math.abs(b.y - (y(v) + 4)) < 12))
    s.append(sv("text", {x: W - pr + 4, y: y(v) + 4, fill: "var(--muted)", "font-size": 10}, fmt(v))); });
  const steigt = i => kerzen ? c[i] >= o[i] : (i === 0 || c[i] >= c[i - 1]);
  // Volumenbalken
  if (mitVol) {
    const v = sl(R.v), vmax = Math.max(1, ...v), vTop = unten - volH;
    s.append(sv("text", {x: pl + 2, y: vTop + 9, fill: "var(--muted)", "font-size": 9}, "Volumen"));
    for (let i = 0; i < n; i++) {
      const hh = Math.max(v[i] > 0 ? 0.8 : 0, volH * v[i] / vmax);
      s.append(sv("rect", {x: x(i) - bw / 2, y: unten - hh, width: bw, height: hh,
        fill: steigt(i) ? "var(--long)" : "var(--short)", opacity: 0.5}));
    }
  }
  if (kerzen) {

// Chart mit Umschaltern (Kerzen/Linie, Zeitraum, Vollbild); Antippen einer Kerze zeigt das Popup.
// art: "signale", "setups" oder "kurse" (Aktie ohne 1-2-3-Muster)
function chartBereich(e, art) {
  const wrap = el("div");
  const hatKerzen = !!(e.kurse.o && e.kurse.h && e.kurse.l);
  let wahl = null;
  const bauen = () => {
    wrap.replaceChildren();
    const ctrl = el("div", {class: "ctrl"});
    const knopf = (text, gruppe, wert) => {
      const b = el("button", {class: "chip", type: "button", text: text, "aria-pressed": String(state[gruppe] === wert)});
      b.addEventListener("click", () => { state[gruppe] = wert; speicher.schreib(gruppe, wert); bauen(); });
      return b;
    };
    if (hatKerzen) { ctrl.append(knopf("Kerzen", "ansicht", "kerzen"), knopf("Linie", "ansicht", "linie"), el("span", {class: "sep"})); }
    ctrl.append(knopf("Auto", "zeitraum", "auto"), knopf("3 Monate", "zeitraum", "3m"), knopf("Alles", "zeitraum", "alles"), el("span", {class: "sep"}));
    const vb = el("button", {class: "chip", type: "button", text: "⤢ Vollbild"});
    vb.addEventListener("click", () => vollbild(e));
    ctrl.append(vb);
    const kerzenModus = hatKerzen && state.ansicht === "kerzen";
    const box = el("div", {class: "cbox"});
    const zeigeChart = () => {
      box.replaceChildren();
      const R = reihen(e), m = fensterGroesse(e, R.c.length);
      const bau = chartBauen(e, R, {W: 360, H: 270, start: R.c.length - m, anzahl: m, leer: leerStd(m), kerzen: state.ansicht === "kerzen",
        volumen: true, volAnteil: 0.15, wahl, position: positionFuerChart(e)});
      bau.svg.addEventListener("click", ev => { wahl = bau.indexAus(ev.clientX); zeigeChart(); });
      box.append(bau.svg);
      if (wahl != null) {
        const gehe = dd => { wahl = Math.max(bau.s0, Math.min(bau.s0 + bau.m - 1, wahl + dd)); zeigeChart(); };
        box.append(popupBauen(e, R, wahl, bau, {zurueck: () => gehe(-1), vor: () => gehe(1), zu: () => { wahl = null; zeigeChart(); }}));
      }
    };
    zeigeChart();
    const muster = art === "kurse" ? "" : "Zahlen = 1-2-3-Punkte, bestimmt nach Schlusskurs" + (art === "signale" ? ". Stern = Ausbruch. " : ". ");
    wrap.append(ctrl, box,
      el("p", {class: "hint", text: (kerzenModus ? "Tageskerzen (grün = Schluss über Eröffnung), darunter das Volumen. Tippe auf eine Kerze für Details. " : "Schlusskurse. ") +
        muster + "Preise in " + zeichenVon(e) + (faktor(e) !== 1 ? ", alle Tage mit dem heutigen Wechselkurs umgerechnet." : ".")}));
  };
  bauen();
  return wrap;
}

// Chart für Aktien ohne aktuelles Signal: auf Wunsch (bei einer Position automatisch) nachladen und anzeigen
function kursChart(a, neuZeichnen) {
  const k = a.kuerzel, wrap = el("div", {class: "kchart"});
  const render = () => {
    wrap.replaceChildren();
    const offen = state.chartOffen[k] != null ? state.chartOffen[k] : !!position(k);
    const b = el("button", {class: "knopf", type: "button", text: offen ? "Chart ausblenden" : "Chart anzeigen", "aria-expanded": String(offen)});
    b.addEventListener("click", () => { state.chartOffen[k] = !offen; render(); });
    wrap.append(b);
    if (!offen) return;
    if (!state.kurse.has(k)) {
      wrap.append(el("p", {class: "hint", text: "Chart wird geladen …"}));
      ladeKurse(k).then(() => neuZeichnen());     // ganze Karte neu, damit auch die Position die Kurse nutzt
      return;
    }
    const K = state.kurse.get(k);
    if (!K) { wrap.append(el("p", {class: "hint", text: "Für diese Aktie gibt es noch keinen Kursverlauf. Er kommt mit dem nächsten Lauf des Screeners."})); return; }
    wrap.append(el("div", {style: "height:8px"}), chartBereich({...a, kurse: K, kette: []}, "kurse"));
  };
  render();
  return wrap;
}

function karte(e, art) {
  const long = e.richtung === "long";
  const schluessel = art + e.kuerzel + e.richtung;
  const offen = state.offen === schluessel;
  const rs = art === "ruecksetzer";
  const rechts = art === "signale"
    ? el("div", {class: "right"}, handelstage(e.tage_her))
    : rs ? el("div", {class: "right"}, zahl.format(e.abstand) + " % " + (long ? "über" : "unter") + " 3")
    : el("div", {class: "right"}, "noch " + zahl.format(e.abstand) + " %");
  const unten = art === "signale"
    ? "Ausbruch " + (long ? "über " : "unter ") + geld(e, e.punkt2) + " · Kurs " + geld(e, e.kurs)
    : rs ? "Punkt 3 bei " + geld(e, e.punkt3) + " · Kurs " + geld(e, e.kurs) + (e.crv != null ? " · CRV 1 : " + zahl.format(e.crv) : "")
    : "Ausbruch bei " + geld(e, e.punkt2) + " · Kurs " + geld(e, e.kurs);
  const kopf = el("button", {class: "head", type: "button", "aria-expanded": String(offen)},
    el("div", {class: "name", text: e.name}),
    rechts,
    el("div", {class: "meta"}, el("span", {class: "badge " + e.richtung, text: long ? "Long" : "Short"}),
      document.createTextNode(e.kuerzel + " · " + e.index + (e.volumen_klasse ? " · Vol. " + e.volumen_klasse : "")), badgeAlt(e), positionsBadge(e)),
    el("div", {class: "right", text: ""}));
  kopf.append(el("div", {class: "meta", text: unten, style: "grid-column:1 / -1"}));
  const k = el("div", {class: "card" + (offen ? " open" : "")}, el("div", {class: "top"}, kopf, stern(e.kuerzel)));
  const detail = el("div", {class: "detail"});
  k.append(detail);
  const fuellen = () => {
    detail.replaceChildren();
    const fakten = el("div", {class: "facts"},
      el("div", {}, el("b", {text: geld(e, e.punkt2)}), el("span", {text: rs ? "Punkt 2 · Ziel" : "Punkt 2"})),
      el("div", {}, el("b", {text: geld(e, e.punkt3)}), el("span", {text: rs ? "Punkt 3 · Stop" : "Punkt 3"})),
      rs ? el("div", {}, el("b", {text: e.crv != null ? "1 : " + zahl.format(e.crv) : zahl.format(e.abstand) + " %"}),
             el("span", {text: e.crv != null ? "CRV bis Punkt 2" : "Abstand zu 3"}))
        : el("div", {}, el("b", {text: art === "signale" ? datumDE(e.signaltag) : zahl.format(e.abstand) + " %"}),
             el("span", {text: art === "signale" ? "Ausbruchstag" : "bis zum Ausbruch"})));
    detail.append(fakten, volumenZeile(e), positionsBlock(rs ? {...e, zielVorschlag: e.punkt2} : e), chartBereich(e, art));
  };
  if (offen) fuellen();
  kopf.addEventListener("click", () => {
    const warOffen = k.classList.contains("open");
    document.querySelectorAll(".card.open").forEach(x => {
      x.classList.remove("open"); x.querySelector(".head").setAttribute("aria-expanded", "false");
    });
    if (!warOffen) { fuellen(); k.classList.add("open"); kopf.setAttribute("aria-expanded", "true"); state.offen = schluessel; }
    else state.offen = null;
  });
  return k;
}

// einfache Karte für Aktien ohne aktuelles Signal/Setup (Suche und Watchlist)
function einfacheKarte(a) {
  const treffer = [];
  state.daten.signale.forEach(x => { if (x.kuerzel === a.kuerzel) treffer.push({r: x.richtung, t: "Signal"}); });
  state.daten.setups.forEach(x => { if (x.kuerzel === a.kuerzel) treffer.push({r: x.richtung, t: "Setup"}); });
  state.daten.ruecksetzer.forEach(x => { if (x.kuerzel === a.kuerzel) treffer.push({r: x.richtung, t: "Rücksetzer"}); });
  const meta = el("div", {class: "meta"});
  treffer.forEach(t => meta.append(el("span", {class: "badge " + t.r, text: t.t + (t.r === "long" ? " Long" : " Short")})));
  meta.append(document.createTextNode(a.kuerzel + (a.index ? " · " + a.index : "") + (a.volumen_klasse ? " · Vol. " + a.volumen_klasse : "")));
  const b = badgeAlt(a); if (b) meta.append(b);
  const pb = positionsBadge(a); if (pb) meta.append(pb);
  const rechts = a.kurs != null
    ? el("div", {class: "right"}, geld(a, a.kurs), el("br"),
        el("span", {class: a.veraenderung >= 0 ? "pos" : "neg", text: prozent(a.veraenderung)}))
    : el("div", {class: "right", text: "keine Daten"});
  const info = el("div", {class: "plain"}, el("div", {class: "name", text: a.name}), rechts, meta);
  if (!treffer.length && a.kurs != null)
    info.append(el("div", {class: "meta", text: "Aktuell kein 1-2-3-Signal oder Setup", style: "grid-column:1 / -1"}));
  const karteE = el("div", {class: "card"}, el("div", {class: "top"}, info, stern(a.kuerzel)));
  if (a.kurs != null) karteE.append(el("div", {class: "pwrap"}, positionsBlock(mitKursen(a.kuerzel, a)),
    kursChart(a, () => { if (karteE.isConnected) karteE.replaceWith(einfacheKarte(a)); })));
  return karteE;
}


/* ---------- Rechner (Kaufsumme und Kursziel) ---------- */
function parseZahl(text) {
  const t = String(text == null ? "" : text).trim().replace(/[\s€%]/g, "");
  if (t === "") return null;
  const norm = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t;
  const v = Number(norm);
  return /^[\d.]+$/.test(norm) && Number.isFinite(v) ? v : NaN;
}
const RECHNER_NAMEN = {stueck: "Stückzahl", kurs: "Kaufkurs", gebKauf: "Gebühren Kauf", slipKauf: "Slippage Kauf",
  slipVerkauf: "Slippage Verkauf", gebVerkauf: "Gebühren Verkauf", ziel: "Gewünschter Gewinn", steuer: "Steuer",
  geld: "Geldkurs", brief: "Briefkurs", budget: "Verfügbares Geld", stopkurs: "Verkaufs-/Stop-Kurs"};

function rechneKursziel(roh) {
  const v = {};
  for (const [id, name] of Object.entries(RECHNER_NAMEN)) {
    const x = parseZahl(roh[id]);
    if (x !== null && Number.isNaN(x)) return {fehler: name + ": bitte eine Zahl eingeben (z. B. 12,50)."};
    v[id] = x;
  }
  if (v.steuer !== null && v.steuer >= 100) return {fehler: "Steuer: bitte einen Wert unter 100 % eingeben."};
  const n = v.stueck, k = v.kurs;
  const sk = v.slipKauf || 0, sv = v.slipVerkauf || 0, gk = v.gebKauf || 0, gv = v.gebVerkauf || 0, t = (v.steuer || 0) / 100;
  // Wie viele Aktien passen ins Budget? Kosten je Aktie = Kaufkurs + Slippage, dazu einmal die Gebühr.
  let budgetInfo = null;
  if (v.budget) {
    if (!k) budgetInfo = {kursFehlt: true};
    else {
      const proAktie = k + sk, frei = v.budget - gk;
      const anzahl = frei >= proAktie ? Math.floor(frei / proAktie + 1e-9) : 0;
      const summe = anzahl > 0 ? anzahl * proAktie + gk : 0;
      budgetInfo = {budget: v.budget, anzahl, summe, rest: v.budget - summe, mindest: proAktie + gk};
    }
  }
  if (!n || !k) return {hinweis: "Gib Stückzahl und Kaufkurs ein, dann erscheint die Rechnung.", budgetInfo};
  const aktien = n * k, slipK = n * sk, einsatz = aktien + slipK + gk;
  const r = {n, k, aktien, slipK, gk, einsatz, breakEven: (einsatz + gv) / n + sv, t, budgetInfo, budget: v.budget};
  if (v.stopkurs) {                                               // Ergebnis, wenn zu diesem Kurs verkauft wird
    const erloes = n * v.stopkurs - n * sv - gv, vor = erloes - einsatz, steuer = vor > 0 ? vor * t : 0;
    r.stop = {kurs: v.stopkurs, erloes, vor, steuer, netto: vor - steuer, proz: vor / einsatz * 100,
      kursProz: (v.stopkurs / k - 1) * 100, budgetProz: v.budget ? vor / v.budget * 100 : null};
  }
  if (v.ziel !== null && v.ziel > 0) {
    const brutto = v.ziel / (1 - t);                              // Gewinn vor Steuer, der nötig ist
    const kursziel = Math.ceil(((einsatz + brutto + gv) / n + sv) * 100 - 1e-7) / 100;   // auf den Cent aufgerundet
    const erloes = n * kursziel - n * sv - gv;
    const vorSteuer = erloes - einsatz, steuer = vorSteuer > 0 ? vorSteuer * t : 0;
    Object.assign(r, {ziel: v.ziel, kursziel, erloes, vorSteuer, steuer, netto: vorSteuer - steuer});
  }
  return r;
}

const eur = v => zahl.format(v) + " €";
function rechnerSeite(ziel) {
  const gespeichert = speicher.lies("rechner", {});
  const werte = (gespeichert && typeof gespeichert === "object" && !Array.isArray(gespeichert)) ? gespeichert : {};
  const felder = {};
  const feld = (id, label) => {
    const inp = el("input", {type: "text", inputmode: "decimal", autocomplete: "off", autocapitalize: "off", id: "r-" + id});
    inp.value = werte[id] || "";
    inp.addEventListener("input", () => { werte[id] = inp.value; speicher.schreib("rechner", werte); aktualisiere(); });
    felder[id] = inp;
    return el("label", {class: "feld"}, el("span", {text: label}), inp);
  };
  const spreadInfo = el("div", {class: "meta", style: "margin-top:8px"});
  const spreadKnopf = el("button", {class: "knopf", type: "button", text: "Halben Spread als Slippage übernehmen"});
  spreadKnopf.addEventListener("click", () => {
    const g = parseZahl(felder.geld.value), b = parseZahl(felder.brief.value);
    if (g === null || b === null || Number.isNaN(g) || Number.isNaN(b) || b <= g) return;
    const halb = ((b - g) / 2).toFixed(4).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",");
    ["slipKauf", "slipVerkauf"].forEach(id => { felder[id].value = halb; werte[id] = halb; });
    speicher.schreib("rechner", werte); aktualisiere();
  });
  const reset = el("button", {class: "knopf", type: "button", text: "Alle Felder leeren"});
  reset.addEventListener("click", () => {
    Object.keys(felder).forEach(id => { felder[id].value = ""; delete werte[id]; });
    speicher.schreib("rechner", werte); aktualisiere();
  });
  const ergebnis = el("div", {class: "rbox", id: "r-ergebnis"});
  const budgetErg = el("div", {style: "margin-top:10px"});
  const zeile = (text, wert, stark, farbe) => el("div", {class: "zeile" + (stark ? " stark" : "")}, el("span", {text: text}),
    el("b", {text: wert, style: farbe ? "color:var(--" + farbe + ")" : ""}));

  function aktualisiere() {
    // Spread aus Geld-/Briefkurs
    const g = parseZahl(felder.geld.value), b = parseZahl(felder.brief.value);
    const spreadOk = g !== null && b !== null && !Number.isNaN(g) && !Number.isNaN(b) && b > g;
    spreadInfo.textContent = spreadOk
      ? "Spread: " + eur(b - g) + " (" + zahl.format((b - g) / ((b + g) / 2) * 100) + " % vom Mittelkurs). Je Seite etwa " + eur((b - g) / 2) + " pro Aktie."
      : "Trage Geld- und Briefkurs aus der Orderansicht ein, dann steht hier der Spread.";
    spreadKnopf.style.display = spreadOk ? "" : "none";
    // Ergebnis
    const r = rechneKursziel(Object.fromEntries(Object.keys(RECHNER_NAMEN).map(id => [id, felder[id].value])));
    ergebnis.replaceChildren(); budgetErg.replaceChildren();
    const bi = r.budgetInfo;
    if (bi) {
      if (bi.kursFehlt) budgetErg.append(el("div", {class: "meta", text: "Trage den Kaufkurs ein, dann erscheint die mögliche Stückzahl."}));
      else if (bi.anzahl < 1) budgetErg.append(el("div", {class: "meta",
        text: "Dein Geld reicht nicht für eine Aktie. Du brauchst mindestens " + eur(bi.mindest) + " (Kurs, Slippage und Gebühr)."}));
      else {
        const uebernehmen = el("button", {class: "knopf", type: "button", text: bi.anzahl + " als Stückzahl übernehmen"});
        uebernehmen.addEventListener("click", () => {
          const wert = String(bi.anzahl); felder.stueck.value = wert; werte.stueck = wert;
          speicher.schreib("rechner", werte); aktualisiere();
        });
        budgetErg.append(el("div", {class: "zielbox"}, el("div", {class: "meta", text: "Mit " + eur(bi.budget) + " kannst du dir leisten"}),
            el("div", {class: "gross", text: bi.anzahl + (bi.anzahl === 1 ? " Aktie" : " Aktien")}),
            el("div", {class: "meta", text: "Kaufsumme " + eur(bi.summe) + " inklusive Slippage und Gebühr, übrig bleiben " + eur(bi.rest)})),
          uebernehmen);
      }
    }
    if (r.fehler) { ergebnis.append(el("div", {class: "fehl", text: r.fehler})); return; }
    if (r.hinweis) { ergebnis.append(el("div", {class: "meta", text: r.hinweis})); return; }
    ergebnis.append(el("h2", {text: "Kaufsumme"}),
      zeile("Aktien (" + zahl.format(r.n) + " × " + zahl.format(r.k) + " €)", eur(r.aktien)),
      zeile("Slippage Kauf", eur(r.slipK)),
      zeile("Gebühren Kauf", eur(r.gk)),
      zeile("Kaufsumme gesamt", eur(r.einsatz), true));
    const verkauf = el("div", {style: "margin-top:12px"}, el("h2", {text: "Verkauf"}));
    verkauf.append(zeile("Break-even (Gewinn 0 €)", eur(r.breakEven) + " (" + prozent((r.breakEven / r.k - 1) * 100) + ")"));
    if (r.kursziel != null) {
      verkauf.append(el("div", {class: "zielbox"},
        el("div", {class: "meta", text: "Kursziel für " + eur(r.ziel) + " Gewinn" + (r.t > 0 ? " nach Steuern" : "")}),
        el("div", {class: "gross", text: eur(r.kursziel)}),
        el("div", {class: "meta", text: prozent((r.kursziel / r.k - 1) * 100) + " zum Kaufkurs, auf den Cent aufgerundet"})),
        zeile("Erlös beim Kursziel (nach Slippage und Gebühren)", eur(r.erloes)),
        zeile("Gewinn vor Steuer", eur(r.vorSteuer)));
      if (r.t > 0) verkauf.append(zeile("Steuer (" + zahl.format(r.t * 100) + " %)", eur(r.steuer)), zeile("Gewinn nach Steuer", eur(r.netto), true));
      else verkauf.append(zeile("Gewinn", eur(r.netto), true));
    } else {
      verkauf.append(el("div", {class: "meta", text: "Trage einen gewünschten Gewinn ein, dann erscheint das Kursziel.", style: "margin-top:6px"}));
    }
    ergebnis.append(verkauf);
    if (r.stop) {
      const st = r.stop, farbe = st.vor >= 0 ? "long" : "short";
      const box = el("div", {style: "margin-top:12px"}, el("h2", {text: "Ergebnis bei Verkauf zu " + eur(st.kurs)}),
        el("div", {class: "zielbox"},
          el("div", {class: "meta", text: st.vor >= 0 ? "Gewinn vor Steuer" : "Verlust"}),
          el("div", {class: "gross", style: "color:var(--" + farbe + ")", text: (st.vor > 0 ? "+" : "") + eur(st.vor)}),
          el("div", {class: "meta", text: prozent(st.kursProz) + " beim Kurs, " + prozent(st.proz) + " der Kaufsumme"})),
        zeile("Erlös (nach Slippage und Gebühren)", eur(st.erloes)),
        zeile("Kaufsumme", eur(r.einsatz)));
      if (st.budgetProz != null) box.append(zeile("Anteil an deinem Geld", prozent(st.budgetProz), false, farbe));
      if (st.vor > 0 && r.t > 0) box.append(zeile("Steuer (" + zahl.format(r.t * 100) + " %)", eur(st.steuer)), zeile("Gewinn nach Steuer", eur(st.netto), true));
      if (st.vor < 0) box.append(el("div", {class: "meta", style: "margin-top:6px", text: "Steuerliche Verlustverrechnung ist hier nicht eingerechnet."}));
      ergebnis.append(box);
    }
  }

  ziel.append(
    el("div", {class: "rbox"}, el("h2", {text: "Kauf"}),
      el("div", {class: "grid2"}, feld("stueck", "Stückzahl"), feld("kurs", "Kaufkurs pro Aktie (€)"),
        feld("gebKauf", "Gebühren Kauf (€)"), feld("budget", "Verfügbares Geld (€), optional")),
      budgetErg),
    el("div", {class: "rbox"}, el("h2", {text: "Slippage und Spread"}),
      el("div", {class: "grid2"}, feld("geld", "Geldkurs / Bid (€)"), feld("brief", "Briefkurs / Ask (€)")),
      spreadInfo, spreadKnopf,
      el("div", {class: "grid2", style: "margin-top:10px"},
        feld("slipKauf", "Slippage je Aktie, Kauf (€)"), feld("slipVerkauf", "Slippage je Aktie, Verkauf (€)"))),
    el("div", {class: "rbox"}, el("h2", {text: "Verkauf und Ziel"}),
      el("div", {class: "grid2"}, feld("gebVerkauf", "Gebühren Verkauf (€)"), feld("ziel", "Gewünschter Gewinn (€)"),
        feld("stopkurs", "Verkaufs-/Stop-Kurs (€), optional"), feld("steuer", "Steuer auf Gewinn (%), optional"))),
    ergebnis,
    el("p", {class: "hint", text: "Alle Beträge in Euro. Kaufsumme = Stückzahl × Kaufkurs + Stückzahl × Slippage + Gebühren. " +
      "Kursziel = Kurs, bei dem nach Slippage, Gebühren und optional Steuer genau der gewünschte Gewinn übrig bleibt. " +
      "Mit dem Verkaufs-/Stop-Kurs siehst du, wie viel Gewinn oder Verlust bei diesem Kurs herauskommt. " +
      "Reine Rechenhilfe ohne Gewähr, die echte Ausführung kann abweichen. Deine Eingaben werden nur auf diesem Gerät gespeichert."}),
    reset);
  aktualisiere();
}

/* ---------- Anzeige ---------- */
function tabBeschriftung() {
  const d = state.daten;
  const tabs = {signale: ["Signale", d.signale.length], setups: ["Setups", d.setups.length], ruecksetzer: ["Rücksetzer", d.ruecksetzer.length],
    merkliste: ["Watchlist", state.merkliste.length], rechner: ["Rechner", "Kursziel"]};
  for (const [name, [text, unten]] of Object.entries(tabs)) {
    const b = document.getElementById("tab-" + name);
    b.replaceChildren(el("span", {text: text}), el("small", {text: String(unten)}));
    b.setAttribute("aria-selected", String(state.tab === name));
  }
}

function zeichne() {
  const d = state.daten; if (!d) return;
  const art = state.tab;
  tabBeschriftung();
  const rechner = art === "rechner";
  document.getElementById("filters").style.display = (art === "merkliste" || rechner) ? "none" : "";
  document.getElementById("anzeige").style.display = rechner ? "none" : "";
  const suchfeld = document.getElementById("suche");
  suchfeld.style.display = rechner ? "none" : "";
  suchfeld.placeholder = art === "merkliste" ? "Aktie suchen und mit ☆ merken" : "Name oder Kürzel suchen";
  const q = state.suche.trim().toLowerCase();
  const passt = e => !q || e.name.toLowerCase().includes(q) || e.kuerzel.toLowerCase().includes(q);
  const ziel = document.getElementById("liste");
  ziel.replaceChildren();
  const leer = text => ziel.append(el("div", {class: "empty", text: text}));
  if (rechner) { rechnerSeite(ziel); return; }

  if (art === "merkliste") {
    if (q) {                                   // Suche über alle Aktien
      const gefunden = [...state.alle.values()].filter(passt);
      if (!gefunden.length) return leer("Keine Aktie gefunden.");
      gefunden.slice(0, 30).forEach(a => ziel.append(einfacheKarte(a)));
      if (gefunden.length > 30) ziel.append(el("div", {class: "empty", text: "Weitere Treffer: Suche genauer eingeben."}));
      return;
    }
    if (!state.merkliste.length)
      return leer("Noch nichts auf der Watchlist. Tippe bei einer Aktie auf ☆ oder suche oben nach einer Aktie.");
    const name = k => (state.alle.get(k) || {name: k}).name.toLowerCase();
    [...state.merkliste].sort((a, b) => name(a).localeCompare(name(b), "de")).forEach(k => {
      const mitMuster = [];
      d.signale.forEach(e => { if (e.kuerzel === k) mitMuster.push(karte(e, "signale")); });
      d.setups.forEach(e => { if (e.kuerzel === k) mitMuster.push(karte(e, "setups")); });
      d.ruecksetzer.forEach(e => { if (e.kuerzel === k) mitMuster.push(karte(e, "ruecksetzer")); });
      if (mitMuster.length) mitMuster.forEach(c => ziel.append(c));
      else ziel.append(einfacheKarte(state.alle.get(k) || {kuerzel: k, name: k, index: ""}));
    });
    return;
  }

  const liste = d[art].filter(e =>
    (state.richtung === "alle" || e.richtung === state.richtung) &&
    (state.index === "alle" || e.index === state.index) &&
    (state.volumen === "alle" || e.volumen_klasse === state.volumen) && passt(e));
  if (!liste.length)
    return leer(d[art].length ? "Nichts gefunden. Filter anpassen." :
      art === "signale" ? "Keine frischen Signale." : art === "ruecksetzer" ? "Keine Rücksetzer nahe Punkt 3." : "Keine aktiven Setups.");
  if (art === "ruecksetzer")
    ziel.append(el("p", {class: "hint", style: "margin:0 0 10px", text: "Bestätigter Trend (schon über einen Punkt 2 ausgebrochen), der Kurs korrigiert und liegt höchstens " +
      zahl.format((d.einstellungen && d.einstellungen.max_ruecksetzer_prozent) || 3).replace(",00", "") +
      " % vor dem letzten Punkt 3. Mögliche Idee: Einstieg nahe 3, Stop unter 3, Ziel Punkt 2. Bricht der Kurs unter 3, ist der Trend gebrochen."}));
  liste.forEach(e => ziel.append(karte(e, art)));
}

function anzeigeLeiste() {
  const z = document.getElementById("anzeige"); z.replaceChildren();
  const d = state.daten;
  const gibtUSD = [...alleMuster(), ...state.alle.values()].some(e => waehrungVon(e) === "USD");
  if (!d.eur_usd || !gibtUSD) return;
  const zeile = el("div", {class: "filters row", style: "display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px"});
  [["Original ($ / €)", "orig"], ["Alles in Euro", "eur"]].forEach(([text, wert]) => {
    const b = el("button", {class: "chip", type: "button", text: text, "aria-pressed": String(state.waehrung === wert)});
    b.addEventListener("click", () => { state.waehrung = wert; speicher.schreib("waehrung", wert); anzeigeLeiste(); zeichne(); });
    zeile.append(b);
  });
  if (euroModus()) zeile.append(el("span", {class: "meta",
    text: "1 € = " + new Intl.NumberFormat("de-DE", {minimumFractionDigits: 4, maximumFractionDigits: 4}).format(d.eur_usd) + " $" +
      (d.eur_usd_datum ? " (" + kurzDatum(d.eur_usd_datum) + ")" : "")}));
  z.append(zeile);
}

function filterLeiste() {
  const f = document.getElementById("filters"); f.replaceChildren();
  const zeile1 = el("div", {class: "row"}), zeile2 = el("div", {class: "row"});
  const mk = (text, gruppe, wert) => {
    const b = el("button", {class: "chip", type: "button", text: text, "aria-pressed": String(state[gruppe] === wert)});
    b.addEventListener("click", () => { state[gruppe] = wert; filterLeiste(); zeichne(); });
    return b;
  };
  [["Alle", "alle"], ["Long", "long"], ["Short", "short"]].forEach(([t, w]) => zeile1.append(mk(t, "richtung", w)));
  const indizes = [...new Set([...state.alle.values(), ...alleMuster()].map(e => e.index))]
    .filter(Boolean);
  zeile2.append(mk("Alle Indizes", "index", "alle"));
  indizes.forEach(i => zeile2.append(mk(i, "index", i)));
  f.append(zeile1, zeile2);
  if (alleMuster().some(e => e.volumen_klasse)) {   // nur wenn die Ergebnisdatei Volumen enthält
    const zeile3 = el("div", {class: "row"}, el("span", {class: "meta", text: "Volumen"}));
    [["Alle", "alle"], ["Hoch", "hoch"], ["Mittel", "mittel"], ["Niedrig", "niedrig"]].forEach(([t, w]) => zeile3.append(mk(t, "volumen", w)));
    f.append(zeile3);
  }
}

async function start() {
  [["signale", "tab-signale"], ["setups", "tab-setups"], ["ruecksetzer", "tab-ruecksetzer"], ["merkliste", "tab-merkliste"], ["rechner", "tab-rechner"]].forEach(([tab, id]) =>
    document.getElementById(id).addEventListener("click", () => { state.tab = tab; state.suche = ""; document.getElementById("suche").value = ""; zeichne(); }));
  document.getElementById("suche").addEventListener("input", ev => { state.suche = ev.target.value; zeichne(); });
  let d;
  try {
    const r = await fetch("ergebnis.json", {cache: "no-cache"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (fehler) {
    document.getElementById("sub").textContent = "Daten konnten nicht geladen werden.";
    document.getElementById("liste").append(el("div", {class: "empty",
      text: "Noch keine Ergebnisdatei vorhanden oder keine Verbindung. (" + fehler.message + ")"}));
    return;
  }
  if (!Array.isArray(d.ruecksetzer)) d.ruecksetzer = [];     // ältere Ergebnisdateien
  state.daten = d;
  // alle Aktien (ältere Ergebnisdateien ohne "alle": Treffer als Ersatz)
  (d.alle || []).forEach(a => state.alle.set(a.kuerzel, a));
  alleMuster().forEach(e => {
    if (!state.alle.has(e.kuerzel)) state.alle.set(e.kuerzel, {kuerzel: e.kuerzel, name: e.name, index: e.index,
      kurs: e.kurs, veraenderung: 0, stand: e.stand});
  });
  const erstellt = new Date(d.erstellt);
  document.getElementById("sub").textContent = "Stand: " + (d.letzter_handelstag ? datumDE(d.letzter_handelstag) : "?") +
    " · " + d.anzahl_geprueft + " von " + d.anzahl_gesamt + " Aktien geprüft";
  if (d.veraltet && d.veraltet.length) {
    const eine = d.veraltet.length === 1;
    document.getElementById("warn").append(el("div", {class: "warn",
      text: (eine ? "Bei 1 Aktie fehlt" : "Bei " + d.veraltet.length + " Aktien fehlt") +
        " der letzte Handelstag in der Datenquelle (Feiertag oder Verzögerung). " +
        (eine ? "Sie ist" : "Sie sind") + " mit \"Daten vom ...\" markiert und nicht ganz aktuell."}));
  }
  const alterTage = (Date.now() - erstellt.getTime()) / 86400000;
  if (alterTage > 4) {
    document.getElementById("warn").append(el("div", {class: "warn",
      text: "Die Daten sind " + Math.floor(alterTage) + " Tage alt. Der automatische Lauf scheint nicht mehr zu funktionieren."}));
  }
  document.getElementById("fuss").textContent = "Berechnet " + erstellt.toLocaleString("de-DE", {dateStyle: "short", timeStyle: "short"}) +
    " aus Kursen der Heimatbörse laut Yahoo Finance (Fenster N=" + d.einstellungen.N + "). " +
    "Kurse bei Trade Republic können um Bruchteile eines Prozents abweichen, weil dort bis spät abends gehandelt wird. " +
    "Watchlist und simulierte Positionen werden nur auf diesem Gerät gespeichert. Keine Anlageberatung.";
  anzeigeLeiste();
  filterLeiste();
  zeichne();
}
start();
</script>
